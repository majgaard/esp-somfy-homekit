; ESP32-C3 SuperMini (board marking HW-466AB), 4 MB flash.
;
; HomeSpan 2.1.8 needs Arduino-ESP32 Core 3.3.0 or later. The official
; platformio/espressif32 platform still ships Core 2.x, so it cannot build
; this. The pioarduino fork is what carries Core 3.x.

[env:supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; HomeSpan needs at least a 1.9 MB app partition. min_spiffs gives 1.9 MB
; with OTA and still fits 4 MB.
board_build.partitions = min_spiffs.csv

build_flags =
    ; The SuperMini has no USB-serial chip. Route the console over native USB.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

lib_extra_dirs = components
lib_deps = homespan/HomeSpan@2.1.8
