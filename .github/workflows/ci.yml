name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run host tests
        run: make -C test/host run
      - name: Run AddressSanitizer and UBSan
        run: make -C test/host asan

  firmware:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install -r requirements-dev.txt
      - name: Build reference configuration
        run: pio run -e supermini
      - name: Build example local configuration
        run: |
          cp include/somfy_config.local.example.h include/somfy_config.local.h
          pio run -e supermini
